- type: code
  title: 1364 mux — wire/reg and explicit sensitivity
  language: systemverilog
  source_file: module7/dut/mux2_1364.v
  code: "module mux2_1995(a, b, sel, y);\n    input  a, b, sel;\n    output y;\n \
    \   wire   a, b, sel;\n    reg    y;\n    always @(a or b or sel)\n        y =\
    \ sel ? b : a;\nendmodule"
  narration: 1364 mux — wire/reg and explicit sensitivity. Review the code on screen
    and match it to files in the repository.
- type: code
  title: 1800 mux — logic and always_comb
  language: systemverilog
  source_file: module7/dut/mux2_1800.sv
  code: "module mux2_1800 (\n    input  logic a, b, sel,\n    output logic y\n);\n\
    \    always_comb y = sel ? b : a;\nendmodule"
  narration: 1800 mux — logic and always_comb. Review the code on screen and match
    it to files in the repository.
