- type: code
  title: Migration checklist pattern
  language: systemverilog
  source_file: module7/examples/migration_checklist/migration_checklist.sv
  code: "/*\n * Module 7: Migration checklist reminder (1364 -> 1800 design subset)\n\
    \ * Prints steps; full checklist in MODULE7.md.\n */\n\nmodule top;\n    initial\
    \ begin\n        $display(\"Module 7: Migration checklist (1364 -> 1800 design\
    \ subset)\");\n        $display(\"  Pre: target standard, baseline sim/synth,\
    \ list files/hierarchy\");\n        $display(\"  Per-module: ports wire/reg->logic,\
    \ @*->always_comb, posedge clk->always_ff\");\n        $display(\"  Per-module:\
    \ case->unique/priority case, optional interface/package, no defparam\");\n  \
    \      $display(\"  Post: full regression, update style guide, document 1364-only\
    \ blocks\");\n        $display(\"  See MODULE7.md for full migration checklist.\"\
    );\n        $finish;\n    end\nendmodule"
  narration: Migration checklist pattern. Review the code on screen and match it to
    files in the repository.
