- type: section
  title: Common pitfalls
- type: bullets
  title: Migrating Everything at Once
  bullets:
  - 'Mistake: Converting a large codebase from 1364 to 1800 in one big change.'
  - 'Reality: Hard to debug; regressions are difficult to isolate.'
  - 'Correct: Migrate incrementally (one module or one feature at a time); run regression
    after each step.'
  - 'Why: Reduces risk and keeps a clear baseline.'
  notes: From MODULE7 Common Pitfalls.
- type: bullets
  title: Ignoring Tool Support
  bullets:
  - 'Mistake: Choosing 1800-2017 and using constructs the synthesis or simulator does
    not support.'
  - 'Reality: Compile or elaboration errors; or tool-specific behavior.'
  - 'Correct: Check tool manuals for supported revision and synthesizable subset;
    align RTL with that.'
  - 'Why: Ensures the project builds and matches tool expectations.'
  notes: From MODULE7 Common Pitfalls.
- type: bullets
  title: Breaking Interfaces During Migration
  bullets:
  - 'Mistake: Changing port list or interface of a block while migrating its internals,
    so that other modules break.'
  - 'Reality: Large ripple of changes; integration failures.'
  - 'Correct: Keep external interface (ports or interface modport) unchanged during
    internal migration; change only implementation (lo'
  - 'Why: Limits scope of change and preserves compatibility with rest of design.'
  notes: From MODULE7 Common Pitfalls.
- type: bullets
  title: Mixing Revisions in One File
  bullets:
  - 'Mistake: Using 1995 ports in one module and 1800 logic in another in the same
    file without a clear rule.'
  - 'Reality: Confusing for readers and tools; possible tool-dependent behavior.'
  - 'Correct: Use one project standard per file (or per project); document the standard
    in the style guide.'
  - 'Why: Consistency and predictable tool behavior.'
  notes: From MODULE7 Common Pitfalls.
- type: bullets
  title: Forgetting to Test After Migration
  bullets:
  - 'Mistake: Changing syntax (e.g. wire→logic, always @*→always_comb) and not re-running
    simulation or synthesis.'
  - 'Reality: Subtle bugs (e.g. latch, wrong sensitivity) can appear.'
  - 'Correct: Run full regression (simulation and synthesis) after every migration
    step; compare with baseline.'
  - 'Why: Catches functional or synthesis differences early.'
  notes: From MODULE7 Common Pitfalls.
- type: section
  title: Practice & assessment
- type: bullets
  title: What you should know
  bullets:
  - ✓ Compare the same design across 1364-1995, 1364-2001, 1364-2005, and 1800 (design
    subset) and list what changes
  - '✓ Compare connectivity style: many ports (1364) vs interface (1800)'
  - ✓ Plan and execute migration from 1364 to 1800 design subset (or between 1364
    revisions) using the migration patterns and checklist
  - ✓ Choose a project standard (revision and subset) based on tool support and constraints
  - ✓ Use the version-selection checklist for new or existing projects
  - ✓ Describe how to extend the course when a new IEEE 1800 revision is released
  notes: From MODULE7 Learning Outcomes.
