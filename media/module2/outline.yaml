- type: code
  title: ANSI ports — mux2 (2001)
  language: systemverilog
  source_file: module2/examples/ansi_ports/mux2.v
  code: "/*\n * 2:1 multiplexer - IEEE 1364-2001 ANSI style\n *\n * Port direction\
    \ and type in port list (no separate declarations).\n */\n\nmodule mux2_2001 (\n\
    \    input  wire a,\n    input  wire b,\n    input  wire sel,\n    output reg\
    \  y\n);\n    always @(a or b or sel)\n        y = sel ? b : a;\nendmodule\n\n\
    module top;\n    reg  a, b, sel;"
  narration: ANSI ports — mux2 (2001). Review the code on screen and match it to files
    in the repository.
- type: code
  title: always @* combinational block
  language: systemverilog
  source_file: module2/examples/procedural/always_star.v
  code: "/*\n * always @* - IEEE 1364-2001 implicit sensitivity\n *\n * Sensitive\
    \ to every signal read in the block; no manual list.\n */\n\nmodule comb_demo\
    \ (\n    input  wire a,\n    input  wire b,\n    input  wire c,\n    input  wire\
    \ sel,\n    output reg  y_comb,\n    output reg  mux_out\n);\n    /* Implicit\
    \ sensitivity: tool infers a, b, c and sel, a, b */\n    always @* begin\n   \
    \     y_comb = (a & b) | c;\n    end\n// ..."
  narration: always @* combinational block. Review the code on screen and match it
    to files in the repository.
