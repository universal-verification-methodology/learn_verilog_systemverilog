- type: bullets
  title: 'Detail: What 1364-2001 Adds Over 1995 (1)'
  bullets:
  - 'ANSI-style port declarations: Direction and type (and size) in the port list'
  - '**`always @*`**: Implicit sensitivity for combinational logic (no manual list)'
  - 'generate: Conditional and loop-based instantiation and logic'
  - 'signed: Signed arithmetic and signed nets/variables'
  notes: From MODULE2 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: What 1364-2001 Adds Over 1995 (1). ANSI-style
    port declarations: Direction and type (and size) in the port list always @*: Implicit
    sensitivity for combinational logic (no manual list) generate: Conditional and
    loop-based instantiation and logic signed: Signed arithmetic and signed nets/variables
    From MODULE2 Topics Covered — protocol/design depth.'
- type: bullets
  title: 'Detail: What 1364-2001 Adds Over 1995 (2)'
  bullets:
  - 'Multi-dimensional arrays: e.g. `reg [7:0] mem [0:255]`'
  - 'localparam: Named constants that cannot be overridden'
  - 'ANSI-style task/function: Input/output in the header'
  - 'Other: File I/O improvements, `$signed`/`$unsigned`, attribute syntax, etc.'
  notes: From MODULE2 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: What 1364-2001 Adds Over 1995 (2). Multi-dimensional
    arrays: e.g. reg [7:0] mem [0:255] localparam: Named constants that cannot be
    overridden ANSI-style task/function: Input/output in the header Other: File I/O
    improvements, $signed/$unsigned, attribute syntax, etc. From MODULE2 Topics Covered
    — protocol/design depth.'
- type: bullets
  title: 'Detail: What 1364-2001 Still Does Not Include'
  bullets:
  - 'No SystemVerilog: no `logic`, `always_comb`/`always_ff`, interfaces, packages,
    classes'
  - No type parameters or interfaces (those are 1800)
  notes: From MODULE2 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: What 1364-2001 Still Does Not Include. No
    SystemVerilog: no logic, always_comb/always_ff, interfaces, packages, classes
    No type parameters or interfaces (those are 1800) From MODULE2 Topics Covered
    — protocol/design depth.'
- type: bullets
  title: 'Detail: ANSI-C Style Ports'
  bullets:
  - 'input wire: Default for input; can omit `wire` (e.g. `input [7:0] a`).'
  - 'output reg: Required when the output is driven in `always`/`initial`.'
  - 'output wire: When the output is driven only by `assign` or submodule.'
  notes: From MODULE2 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: ANSI-C Style Ports. input wire: Default
    for input; can omit wire (e.g. input [7:0] a). output reg: Required when the output
    is driven in always/initial. output wire: When the output is driven only by assign
    or submodule. From MODULE2 Topics Covered — protocol/design depth.'
- type: bullets
  title: 'Detail: Comparison: 1995 vs 2001 Port Style'
  bullets:
  - Same behavior; 2001 is more concise and keeps port and type in one place.
  notes: From MODULE2 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: Comparison: 1995 vs 2001 Port Style. Same
    behavior; 2001 is more concise and keeps port and type in one place. From MODULE2
    Topics Covered — protocol/design depth.'
- type: bullets
  title: 'Detail: always @* Syntax'
  bullets:
  - '**`@*` (or `@(*)`**): Sensitive to every signal read in the block (RHS and conditions).'
  - Use for combinational logic only; do not use for sequential (use `always @(posedge
    clk)`).
  notes: From MODULE2 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: always @* Syntax. **@* (or @(*)**): Sensitive
    to every signal read in the block (RHS and conditions). Use for combinational
    logic only; do not use for sequential (use always @(posedge clk)). From MODULE2
    Topics Covered — protocol/design depth.'
- type: bullets
  title: 'Detail: When to Use @* vs Explicit List'
  bullets:
  - '**Prefer `@*`**: For combinational blocks; fewer errors, easier to maintain.'
  - 'Explicit list: When targeting strict 1995 compatibility or when a tool does not
    support `@*`.'
  notes: From MODULE2 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: When to Use @* vs Explicit List. Prefer
    @*: For combinational blocks; fewer errors, easier to maintain. Explicit list:
    When targeting strict 1995 compatibility or when a tool does not support @*. From
    MODULE2 Topics Covered — protocol/design depth.'
- type: bullets
  title: 'Detail: generate / endgenerate'
  bullets:
  - 'genvar: Loop variable for generate loops; not a runtime variable.'
  - 'generate for: Replicates logic/instances; index must be constant at elaboration.'
  notes: From MODULE2 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: generate / endgenerate. genvar: Loop variable
    for generate loops; not a runtime variable. generate for: Replicates logic/instances;
    index must be constant at elaboration. From MODULE2 Topics Covered — protocol/design
    depth.'
- type: bullets
  title: 'Detail: Conditional Generate'
  bullets:
  - 'generate if / else: Choose one of several implementations at elaboration.'
  notes: From MODULE2 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: Conditional Generate. generate if / else:
    Choose one of several implementations at elaboration. From MODULE2 Topics Covered
    — protocol/design depth.'
- type: bullets
  title: 'Detail: signed Wire and reg'
  bullets:
  - 'signed: Affects arithmetic and comparison in expressions involving that net/reg.'
  - 'Unsigned (default): No sign extension; values 0 to 2^N-1.'
  notes: From MODULE2 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: signed Wire and reg. signed: Affects arithmetic
    and comparison in expressions involving that net/reg. Unsigned (default): No sign
    extension; values 0 to 2^N-1. From MODULE2 Topics Covered — protocol/design depth.'
- type: bullets
  title: 'Detail: Declaration and Usage'
  bullets:
  - 'Packed (left): `[7:0]` — contiguous bits, can be used as a single vector.'
  - 'Unpacked (right): `[0:255]` — array of elements; select with one index at a time
    in 2001.'
  notes: From MODULE2 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: Declaration and Usage. Packed (left): [7:0]
    — contiguous bits, can be used as a single vector. Unpacked (right): [0:255] —
    array of elements; select with one index at a time in 2001. From MODULE2 Topics
    Covered — protocol/design depth.'
- type: bullets
  title: 'Detail: Task (2001 ANSI)'
  bullets:
  - 'automatic: Optional; gives automatic storage (re-entrant). Useful for recursive
    or concurrent calls.'
  - 'input/output in header: Cleaner than 1995 style; avoids duplicate declarations.'
  - 'Note: In 1364-2001 use `output reg` (not `output logic`; `logic` is SystemVerilog).'
  notes: From MODULE2 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: Task (2001 ANSI). automatic: Optional; gives
    automatic storage (re-entrant). Useful for recursive or concurrent calls. input/output
    in header: Cleaner than 1995 style; avoids duplicate declarations. Note: In 1364-2001
    use output reg (not output logic; logic is SystemVerilog). From MODULE2 Topics
    Covered — protocol/design depth.'
