- type: code
  title: Generate block — parameterized mux
  language: systemverilog
  source_file: module2/examples/generate/param_mux.v
  code: "/*\n * Parameterized mux with generate if - IEEE 1364-2001\n * generate for\
    \ / generate if; elaboration-time logic.\n */\n\nmodule mux_wide #(parameter WIDTH\
    \ = 8) (\n    input  wire [WIDTH-1:0] a,\n    input  wire [WIDTH-1:0] b,\n   \
    \ input  wire             sel,\n    output wire [WIDTH-1:0] y\n);\n    generate\n\
    \        if (WIDTH == 1)\n            assign y = sel ? b : a;\n        else\n\
    \            assign y = sel ? b : a;\n    endgenerate\nendmodule\n// ..."
  narration: Generate block — parameterized mux. Review the code on screen and match
    it to files in the repository.
