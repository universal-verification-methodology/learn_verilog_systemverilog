- type: section
  title: Common pitfalls
  narration: 'Next section: Common pitfalls.'
- type: bullets
  title: Using always @* for Sequential Logic
  bullets:
  - 'Mistake: `always @* q <= d;` intending a flip-flop.'
  - 'Reality: `@*` is for combinational logic; it does not create a clock edge.'
  - 'Correct: Use `always @(posedge clk)` (and `<=`) for sequential logic.'
  - 'Why: Mixing the two causes simulation/synthesis mismatches and unintended latches.'
  notes: From MODULE2 Common Pitfalls.
  narration: 'Using always @* for Sequential Logic. Mistake: always @* q <= d; intending
    a flip-flop. Reality: @* is for combinational logic; it does not create a clock
    edge. Correct: Use always @(posedge clk) (and <=) for sequential logic. Why: Mixing
    the two causes simulation/synthesis mismatches and unintended latches.'
- type: bullets
  title: genvar in Normal Code
  bullets:
  - 'Mistake: Using genvar in an always block or initial block.'
  - 'Reality: genvar is only for generate loops; it does not exist at runtime.'
  - 'Correct: Use integer or reg for runtime loops; use genvar only inside generate
    for.'
  - 'Why: genvar is elaborated away; it is not a simulation variable.'
  notes: From MODULE2 Common Pitfalls.
  narration: 'genvar in Normal Code. Mistake: Using genvar in an always block or initial
    block. Reality: genvar is only for generate loops; it does not exist at runtime.
    Correct: Use integer or reg for runtime loops; use genvar only inside generate
    for. Why: genvar is elaborated away; it is not a simulation variable.'
- type: bullets
  title: Overriding localparam
  bullets:
  - 'Mistake: Trying to override localparam at instantiation (e.g. `#(.MAX(100))`).'
  - 'Reality: localparam cannot be overridden.'
  - 'Correct: Use parameter for values that must be overridden; use localparam for
    fixed or derived constants.'
  - 'Why: The standard does not allow localparam in the parameter list.'
  notes: From MODULE2 Common Pitfalls.
  narration: 'Overriding localparam. Mistake: Trying to override localparam at instantiation
    (e.g. #(.MAX(100))). Reality: localparam cannot be overridden. Correct: Use parameter
    for values that must be overridden; use localparam for fixed or derived constants.
    Why: The standard does not allow localparam in the parameter list.'
- type: bullets
  title: Signed vs Unsigned Mix
  bullets:
  - 'Mistake: Mixing signed and unsigned in one expression without $signed/$unsigned
    and expecting a particular sign behavior.'
  - 'Reality: Rules for sign extension and comparison depend on operands.'
  - 'Correct: Be explicit: use signed types or $signed/$unsigned and verify with testbenches.'
  - 'Why: Implicit mixing leads to wrong arithmetic and comparison results.'
  notes: From MODULE2 Common Pitfalls.
  narration: 'Signed vs Unsigned Mix. Mistake: Mixing signed and unsigned in one expression
    without $signed/$unsigned and expecting a particular sign behavior. Reality: Rules
    for sign extension and comparison depend on operands. Correct: Be explicit: use
    signed types or $signed/$unsigned and verify with testbenches. Why: Implicit mixing
    leads to wrong arithmetic and comparison results.'
- type: bullets
  title: Generate Block Scope
  bullets:
  - 'Mistake: Referencing generate block names or genvar at runtime.'
  - 'Reality: Generate blocks are elaborated at compile time; names are for hierarchy.'
  - 'Correct: Use generate for structure; use normal variables and blocks for runtime
    behavior.'
  - 'Why: Generate is not “runtime”; it only affects what gets instantiated.'
  notes: From MODULE2 Common Pitfalls.
  narration: 'Generate Block Scope. Mistake: Referencing generate block names or genvar
    at runtime. Reality: Generate blocks are elaborated at compile time; names are
    for hierarchy. Correct: Use generate for structure; use normal variables and blocks
    for runtime behavior. Why: Generate is not “runtime”; it only affects what gets
    instantiated.'
