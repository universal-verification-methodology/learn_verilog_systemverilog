- type: code
  title: Build and run (Makefile)
  language: text
  source_file: module1/examples/modules_ports/Makefile
  code: "# Build and run modules_ports example (1364-1995)\n# Requires: iverilog (or\
    \ compatible simulator)\n\nSIM ?= iverilog\nTOP ?= top\n\n.PHONY: run clean\n\n\
    run: $(TOP)\n\tvvp $(TOP)\n\n$(TOP): and_gate.v\n\tiverilog -o $(TOP) and_gate.v\n\
    \nclean:\n\trm -f $(TOP)"
  notes: iverilog compiles to top; vvp runs the simulation executable.
  narration: Build and run (Makefile). Review the code on screen and match it to files
    in the repository. iverilog compiles to top; vvp runs the simulation executable.
