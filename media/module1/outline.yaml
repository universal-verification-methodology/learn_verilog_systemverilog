- type: code
  title: DUT example — and_gate (1995 style)
  language: systemverilog
  source_file: module1/examples/modules_ports/and_gate.v
  code: "module and_gate(a, b, y);\n    input  a;\n    input  b;\n    output y;\n\n\
    \    wire a, b;\n    reg  y;\n\n    always @(a or b)\n        y = a & b;\nendmodule"
  notes: Non-ANSI port list; output y is reg because always drives it.
  narration: DUT example — and_gate (1995 style). Review the code on screen and match
    it to files in the repository. Non-ANSI port list; output y is reg because always
    drives it.
- type: code
  title: Testbench — stimulus and $finish
  language: systemverilog
  source_file: module1/examples/testbenches/test_and_gate.v
  code: "    reg  a, b;\n    wire y;\n\n    and_gate u_dut (.a(a), .b(b), .y(y));\n\
    \n    initial begin\n        $display(\"a b y\");\n        a = 0; b = 0; #10 $display(\"\
    %b %b %b\", a, b, y);\n        a = 0; b = 1; #10 $display(\"%b %b %b\", a, b,\
    \ y);\n        a = 1; b = 0; #10 $display(\"%b %b %b\", a, b, y);\n        a =\
    \ 1; b = 1; #10 $display(\"%b %b %b\", a, b, y);\n        $finish;\n    end"
  notes: reg drives inputs; wire observes output; initial applies all input combos.
  narration: Testbench — stimulus and $finish. Review the code on screen and match
    it to files in the repository. reg drives inputs; wire observes output; initial
    applies all input combos.
