    sensitivity list defines when it runs. 1364-1995: Sensitivity list is mandatory
    and explicit — no @*. Use blocking = for combinational, nonblocking <= for sequential
    (flip-flops). Example (D flip-flop): module1/examples/sequential_dff/dff.v Runs
    once at time zero. Used for testbenches: stimulus, $display, $finish.'
- type: bullets
  title: 6. Delays and Timing
  bullets:
  - '`#n`: Delay by `n` time units (e.g. `#10`).'
  - '`@(event)`: Wait for event (e.g. `@(posedge clk)`).'
  - '`wait(condition)`: Wait until condition is true.'
  notes: From MODULE1 Topics Covered.
  narration: '6. Delays and Timing. #n: Delay by n time units (e.g. #10). @(event):
    Wait for event (e.g. @(posedge clk)). wait(condition): Wait until condition is
    true.'
- type: bullets
  title: 7. Tasks and Functions (1995 Style)
  bullets:
  - 'Function: Returns a single value; no delays (zero-time).'
  - 'Task: Can have delays and multiple outputs (output/inout args).'
  notes: From MODULE1 Topics Covered.
  narration: '7. Tasks and Functions (1995 Style). Function: Returns a single value;
    no delays (zero-time). Task: Can have delays and multiple outputs (output/inout
    args).'
- type: bullets
  title: 8. Simple Testbench (1364-1995)
  bullets:
  - '`$display`: Print once.'
  - '`$monitor`: Print whenever a listed signal changes (optional).'
  - '`$finish`: End simulation.'
  notes: From MODULE1 Topics Covered.
  narration: '8. Simple Testbench (1364-1995). $display: Print once. $monitor: Print
    whenever a listed signal changes (optional). $finish: End simulation.'
