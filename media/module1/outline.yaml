- type: bullets
  title: 'Detail: What 1364-1995 Includes (1)'
  bullets:
  - 'Modules and hierarchy: Module declaration, port list, instantiation'
  - 'Nets: `wire` (and `wand`, `wor`, `tri`; rarely used in RTL)'
  - 'Variables: `reg` for procedural assignment outputs'
  - 'Continuous assignment: `assign` for combinational logic'
  notes: From MODULE1 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: What 1364-1995 Includes (1). Modules and
    hierarchy: Module declaration, port list, instantiation Nets: wire (and wand,
    wor, tri; rarely used in RTL) Variables: reg for procedural assignment outputs
    Continuous assignment: assign for combinational logic From MODULE1 Topics Covered
    — protocol/design depth.'
- type: bullets
  title: 'Detail: What 1364-1995 Includes (2)'
  bullets:
  - 'Procedural blocks: `always`, `initial` with explicit sensitivity lists'
  - 'Delays and timing: `#`, `@`, `wait`'
  - 'Tasks and functions: Non-ANSI style (declarations separate from port list)'
  - 'System tasks: `$display`, `$monitor`, `$finish`, `$stop`, `$time`'
  notes: From MODULE1 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: What 1364-1995 Includes (2). Procedural
    blocks: always, initial with explicit sensitivity lists Delays and timing: #,
    @, wait Tasks and functions: Non-ANSI style (declarations separate from port list)
    System tasks: $display, $monitor, $finish, $stop, $time From MODULE1 Topics Covered
    — protocol/design depth.'
- type: bullets
  title: 'Detail: What 1364-1995 Does Not Include (1)'
  bullets:
  - No ANSI-style port declarations (added in 1364-2001)
  - No **`always @*`** (added in 1364-2001)
  - No generate (added in 1364-2001)
  - No signed keyword, no multi-dimensional arrays (1364-2001)
  notes: From MODULE1 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: What 1364-1995 Does Not Include (1). No
    ANSI-style port declarations (added in 1364-2001) No always @* (added in 1364-2001)
    No generate (added in 1364-2001) No signed keyword, no multi-dimensional arrays
    (1364-2001) From MODULE1 Topics Covered — protocol/design depth.'
- type: bullets
  title: 'Detail: What 1364-1995 Does Not Include (2)'
  bullets:
  - 'No SystemVerilog: no `logic`, `always_comb`, `always_ff`, interfaces, packages'
  notes: From MODULE1 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: What 1364-1995 Does Not Include (2). No
    SystemVerilog: no logic, always_comb, always_ff, interfaces, packages From MODULE1
    Topics Covered — protocol/design depth.'
- type: bullets
  title: 'Detail: Module Declaration (1995 Style)'
  bullets:
  - 'Port list: Only port names: `(a, b, y)`.'
  - 'Port direction: Declared inside the module: `input`, `output`.'
  - 'Port type: Declared inside the module: `wire` or `reg` (default for `input` is
    `wire`; for `output` can be `wire` or `reg`).'
  notes: From MODULE1 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: Module Declaration (1995 Style). Port list:
    Only port names: (a, b, y). Port direction: Declared inside the module: input,
    output. Port type: Declared inside the module: wire or reg (default for input
    is wire; for output can be wire or reg). From MODULE1 Topics Covered — protocol/design
    depth.'
- type: bullets
  title: 'Detail: Module Instantiation (1995 Style)'
  bullets:
  - 'Named port connection: `.port_name(signal_name)` — recommended for readability.'
  - 'Positional: Order must match port list.'
  notes: From MODULE1 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: Module Instantiation (1995 Style). Named
    port connection: .port_name(signal_name) — recommended for readability. Positional:
    Order must match port list. From MODULE1 Topics Covered — protocol/design depth.'
- type: bullets
  title: 'Detail: wire (Net)'
  bullets:
  - Represents a physical connection between components.
  - Driven by continuous assignment (`assign`) or by module output.
  - Cannot be assigned inside `always` or `initial` (use `reg` for that).
  notes: From MODULE1 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: wire (Net). Represents a physical connection
    between components. Driven by continuous assignment (assign) or by module output.
    Cannot be assigned inside always or initial (use reg for that). From MODULE1 Topics
    Covered — protocol/design depth.'
- type: bullets
  title: 'Detail: reg (Variable)'
  bullets:
  - Holds a value; can be assigned in `always` or `initial`.
  - Does not imply a flip-flop; flip-flops come from `always @(posedge clk)` (or similar).
  - Used for outputs that are driven procedurally.
  notes: From MODULE1 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: reg (Variable). Holds a value; can be assigned
    in always or initial. Does not imply a flip-flop; flip-flops come from always
    @(posedge clk) (or similar). Used for outputs that are driven procedurally. From
    MODULE1 Topics Covered — protocol/design depth.'
- type: bullets
  title: 'Detail: 4-State Logic (1364-1995)'
  bullets:
  - 'Both `wire` and `reg` are 4-state: `0`, `1`, `X` (unknown), `Z` (high-impedance).'
  notes: From MODULE1 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: 4-State Logic (1364-1995). Both wire and
    reg are 4-state: 0, 1, X (unknown), Z (high-impedance). From MODULE1 Topics Covered
    — protocol/design depth.'
- type: bullets
  title: 'Detail: always Block'
  bullets:
  - Repeated execution; sensitivity list defines when it runs.
  - '1364-1995: Sensitivity list is mandatory and explicit — no `@*`.'
  - Use blocking `=` for combinational, nonblocking `<=` for sequential (flip-flops).
  - 'Example (D flip-flop): `module1/examples/sequential_dff/dff.v`'
  notes: From MODULE1 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: always Block. Repeated execution; sensitivity
    list defines when it runs. 1364-1995: Sensitivity list is mandatory and explicit
    — no @*. Use blocking = for combinational, nonblocking <= for sequential (flip-flops).
    Example (D flip-flop): module1/examples/sequential_dff/dff.v From MODULE1 Topics
    Covered — protocol/design depth.'
- type: bullets
  title: 'Detail: initial Block'
  bullets:
  - 'Runs once at time zero. Used for testbenches: stimulus, `$display`, `$finish`.'
  notes: From MODULE1 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: initial Block. Runs once at time zero. Used
    for testbenches: stimulus, $display, $finish. From MODULE1 Topics Covered — protocol/design
    depth.'
