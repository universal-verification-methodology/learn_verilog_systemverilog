- type: section
  title: Common pitfalls
  narration: 'Next section: Common pitfalls.'
- type: bullets
  title: Incomplete Sensitivity List
  bullets:
  - 'Mistake: `always @(sel) y = sel ? b : a;` (missing `a` and `b`)'
  - 'Reality: In 1364-1995 you must list every input that the block reads'
  - 'Correct: `always @(a or b or sel) y = sel ? b : a;`'
  - 'Why: Incomplete lists cause simulation/synthesis mismatches and inferred latches'
  notes: From MODULE1 Common Pitfalls.
  narration: 'Incomplete Sensitivity List. Mistake: always @(sel) y = sel ? b : a;
    (missing a and b) Reality: In 1364-1995 you must list every input that the block
    reads Correct: always @(a or b or sel) y = sel ? b : a; Why: Incomplete lists
    cause simulation/synthesis mismatches and inferred latches'
- type: bullets
  title: Port Type Mismatch
  bullets:
  - 'Mistake: Declaring as `wire` an output that is assigned in `always`'
  - 'Reality: Outputs driven in procedural blocks must be `reg`'
  - 'Correct: `output y; reg y;` when `y` is assigned in `always`'
  - 'Why: `wire` cannot be the target of procedural assignment'
  notes: From MODULE1 Common Pitfalls.
  narration: 'Port Type Mismatch. Mistake: Declaring as wire an output that is assigned
    in always Reality: Outputs driven in procedural blocks must be reg Correct: output
    y; reg y; when y is assigned in always Why: wire cannot be the target of procedural
    assignment'
- type: bullets
  title: Simulation Never Ends
  bullets:
  - 'Mistake: Testbench without `$finish`'
  - 'Correct: Always call `$finish` after stimulus (e.g. `#1000; $finish;`)'
  - 'Why: Simulator runs until explicit termination or limit'
  notes: From MODULE1 Common Pitfalls.
  narration: 'Simulation Never Ends. Mistake: Testbench without $finish Correct: Always
    call $finish after stimulus (e.g. #1000; $finish;) Why: Simulator runs until explicit
    termination or limit'
- type: bullets
  title: Using 2001/SystemVerilog Constructs in 1995
  bullets:
  - 'Mistake: Writing `always @*` or ANSI ports and assuming 1995'
  - 'Reality: `always @*` and ANSI ports are 1364-2001; `logic`/`always_comb` are
    SystemVerilog'
  - 'Correct: For strict 1995, use explicit sensitivity and non-ANSI ports'
  - 'Why: Keeps code portable to 1995-only tools and clarifies version scope'
  notes: From MODULE1 Common Pitfalls.
  narration: 'Using 2001/SystemVerilog Constructs in 1995. Mistake: Writing always
    @* or ANSI ports and assuming 1995 Reality: always @* and ANSI ports are 1364-2001;
    logic/always_comb are SystemVerilog Correct: For strict 1995, use explicit sensitivity
    and non-ANSI ports Why: Keeps code portable to 1995-only tools and clarifies version
    scope'
- type: bullets
  title: Confusing reg with Registers
  bullets:
  - 'Mistake: Thinking `reg` creates a flip-flop'
  - 'Reality: `reg` is a variable type; flip-flops come from `always @(posedge clk)`
    with `<=`'
  - 'Correct: Use `reg` for any procedural output; use clocked `always` for sequential
    logic'
  - 'Why: Clarifies design intent and avoids synthesis surprises'
  notes: From MODULE1 Common Pitfalls.
  narration: 'Confusing reg with Registers. Mistake: Thinking reg creates a flip-flop
    Reality: reg is a variable type; flip-flops come from always @(posedge clk) with
    <= Correct: Use reg for any procedural output; use clocked always for sequential
    logic Why: Clarifies design intent and avoids synthesis surprises'
