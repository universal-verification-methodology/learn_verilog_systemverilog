- type: bullets
  title: 'Detail: Modport Expressions (2009)'
  bullets:
  - 'Use: When the same interface is used with different signal subsets or derived
    signals; check tool support for exact syntax.'
  - 'Benefit: Fewer duplicate interface definitions; clearer connection contract.'
  notes: From MODULE5 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: Modport Expressions (2009). Use: When the
    same interface is used with different signal subsets or derived signals; check
    tool support for exact syntax. Benefit: Fewer duplicate interface definitions;
    clearer connection contract. From MODULE5 Topics Covered — protocol/design depth.'
- type: bullets
  title: 'Detail: Virtual Interface (2009)'
  bullets:
  - 'Design: Rarely used in RTL; RTL typically connects to a concrete interface instance.'
  - 'Verification: Common in UVM and other OOP testbenches; allows one driver class
    to work with any instance of the interface.'
  notes: From MODULE5 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: Virtual Interface (2009). Design: Rarely
    used in RTL; RTL typically connects to a concrete interface instance. Verification:
    Common in UVM and other OOP testbenches; allows one driver class to work with
    any instance of the interface. From MODULE5 Topics Covered — protocol/design depth.'
- type: bullets
  title: 'Detail: Integer Types and Sizes'
  bullets:
  - 'byte, shortint, int, longint: 8, 16, 32, 64 bits; signed by default.'
  - 'byte unsigned, int unsigned: Unsigned variants.'
  - 'Clarifications in 2012: Representation and conversion rules; use in RTL for constants
    and parameters.'
  notes: From MODULE5 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: Integer Types and Sizes. byte, shortint,
    int, longint: 8, 16, 32, 64 bits; signed by default. byte unsigned, int unsigned:
    Unsigned variants. Clarifications in 2012: Representation and conversion rules;
    use in RTL for constants and parameters. From MODULE5 Topics Covered — protocol/design
    depth.'
- type: bullets
  title: 'Detail: Operators Added or Clarified'
  bullets:
  - 'inside: Already in 2005; 2009/2012 clarify set membership and use with ranges.'
  - 'Wildcard equality `==?`: X/Z in the right-hand side act as “don’t care” in comparisons.'
  - 'Set membership and case (inside): Used in case statements and constraints; semantics
    clarified in 2012.'
  notes: From MODULE5 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: Operators Added or Clarified. inside: Already
    in 2005; 2009/2012 clarify set membership and use with ranges. Wildcard equality
    ==?: X/Z in the right-hand side act as “don’t care” in comparisons. Set membership
    and case (inside): Used in case statements and constraints; semantics clarified
    in 2012. From MODULE5 Topics Covered — protocol/design depth.'
- type: bullets
  title: 'Detail: Array Methods (2012)'
  bullets:
  - 'Array methods: `.size()`, `.delete()`, `.sort()`, `.reverse()`, etc. (exact set
    is revision-dependent).'
  - 'Queues: `.push_back()`, `.pop_front()`, `.insert()`, etc.'
  - 'Use in RTL: Limited (arrays in RTL are often fixed); methods are common in testbenches
    and checkers.'
  notes: From MODULE5 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: Array Methods (2012). Array methods: .size(),
    .delete(), .sort(), .reverse(), etc. (exact set is revision-dependent). Queues:
    .push_back(), .pop_front(), .insert(), etc. Use in RTL: Limited (arrays in RTL
    are often fixed); methods are common in testbenches and checkers. From MODULE5
    Topics Covered — protocol/design depth.'
- type: bullets
  title: 'Detail: Array Assignment and Ordering'
  bullets:
  - 'Packed vs unpacked: Assignment rules and ordering (row-major, etc.) are clarified.'
  - 'Array copy: Whole-array assignment and copying; compatibility of dimensions.'
  - 'Use in RTL: Multi-dimensional arrays (e.g. memories) and parameterized dimensions;
    follow tool-supported subset for synthesis.'
  notes: From MODULE5 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: Array Assignment and Ordering. Packed vs
