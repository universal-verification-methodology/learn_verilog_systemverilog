- type: section
  title: How to learn this module
- type: bullets
  title: Suggested learning path (1/2)
  bullets:
  - Skim this document — Goal, Overview, and Topics Covered set the IEEE scope for
    Module 5.
  - Study design architecture — See how DUTs, examples, and testbenches fit together
    under `module5/`.
  - Work through labs in order — Open `module5/EXAMPLES.md` and run each `make clean
