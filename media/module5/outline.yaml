- type: section
  title: Common pitfalls
- type: bullets
  title: Assuming 2009/2012 Features in an 2005-Only Flow
  bullets:
  - 'Mistake: Using virtual interface, checker, or 2012 array methods when the project
    or tool is 1800-2005 only.'
  - 'Reality: Compile or elaboration errors; or undefined behavior.'
  - 'Correct: Confirm project standard and tool revision; use only features of that
    revision.'
  - 'Why: Backward compatibility is 2005→2009→2012; tools may not implement all newer
    features.'
  notes: From MODULE5 Common Pitfalls.
- type: bullets
  title: Virtual Interface in RTL
  bullets:
  - 'Mistake: Using a virtual interface in synthesizable RTL.'
  - 'Reality: Virtual interfaces are for dynamic binding (testbench); not for hardware.'
  - 'Correct: Use concrete interface instances in RTL; use virtual interface only
    in testbench classes.'
  - 'Why: Synthesis does not support virtual interface; it is a simulation construct.'
  notes: From MODULE5 Common Pitfalls.
- type: bullets
  title: Checker Synthesis
  bullets:
  - 'Mistake: Expecting a checker to be synthesized like a module.'
  - 'Reality: Checkers are for assertion/coverage; typically not synthesized.'
  - 'Correct: Use checkers for verification; keep RTL in modules.'
  - 'Why: Checker semantics are for checking, not for netlist generation.'
  notes: From MODULE5 Common Pitfalls.
- type: bullets
  title: Array Methods in RTL
  bullets:
  - 'Mistake: Using dynamic array or queue methods (e.g. .push_back) in synthesizable
    RTL.'
  - 'Reality: Many such methods are not synthesizable or are tool-specific.'
  - 'Correct: In RTL use fixed-size or parameterized arrays and indexing; use methods
    in testbenches or checkers.'
  - 'Why: Synthesis subset of SystemVerilog is smaller than the full language.'
  notes: From MODULE5 Common Pitfalls.
- type: bullets
  title: $unit vs Package
  bullets:
  - 'Mistake: Putting shared types or functions in $unit and relying on compilation
    order.'
  - 'Reality: $unit visibility and order are tool-dependent; can cause subtle bugs.'
  - 'Correct: Put shared items in packages; use explicit import.'
  - 'Why: Packages give a clear namespace and import order; 2012 clarifies compilation
    unit but packages remain best practice.'
  notes: From MODULE5 Common Pitfalls.
- type: section
  title: Practice & assessment
- type: bullets
  title: What you should know
  bullets:
  - ✓ Describe what 1800-2009 and 1800-2012 add or clarify over 1800-2005 (interfaces,
    types, arrays, assertions, checkers)
  - ✓ Use interface refinements (modport expressions, virtual interface) when the
    project and tool support 2009+
  - ✓ Use `inside` and `==?` appropriately in RTL or testbenches
  - ✓ Apply array and string refinements (2012) in testbenches or checkers; know the
    synthesizable subset for RTL
  - ✓ Use immediate assertions in RTL for simple invariants; understand checker (2012)
    as reusable property block
  - ✓ Summarize 1800-2005 vs 2009 vs 2012 and choose a standard based on tool and
    project
  notes: From MODULE5 Learning Outcomes.
