- type: bullets
  title: 'Detail: Assertions in Design (Brief)'
  bullets:
  - 'immediate assertions: `assert (condition) else $error("...");` — checked when
    executed (like an if-check).'
  - 'concurrent assertions: `assert property (@(posedge clk) (a |-> b));` — checked
    over time; typically in verification.'
  - 'Use in RTL: Immediate assertions for invariants (e.g. one-hot, valid encodings);
    concurrent assertions often in bind files or testbench.'
  notes: From MODULE5 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: Assertions in Design (Brief). immediate
    assertions: assert (condition) else $error("..."); — checked when executed (like
    an if-check). concurrent assertions: assert property (@(posedge clk) (a — -> b));
    — checked over time; typically in verification. Use in RTL: Immediate assertions
    for invariants (e.g. one-hot, valid encodings); concurrent assertions often in
    bind...'
- type: bullets
  title: 'Detail: Checker (2012)'
  bullets:
  - 'checker: A reusable unit that can contain assertions, assumptions, coverage,
    and helper logic; can be instantiated in design or testbench.'
  - 'Use: Encapsulate a set of properties (e.g. protocol rules) and reuse across modules
    or hierarchies.'
  - 'Design: Checkers can be bound to RTL modules; they do not change RTL functionality,
    only add checking.'
  - 'Synthesis: Checkers are typically not synthesized; they are for simulation and
    formal tools.'
  notes: From MODULE5 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: Checker (2012). checker: A reusable unit
    that can contain assertions, assumptions, coverage, and helper logic; can be instantiated
    in design or testbench. Use: Encapsulate a set of properties (e.g. protocol rules)
    and reuse across modules or hierarchies. Design: Checkers can be bound to RTL
    modules; they do not change RTL functionality, only add checking. Synthesis...'
- type: bullets
  title: 'Detail: Compilation Unit'
  bullets:
  - 'Compilation unit: The scope of one or more source files compiled together (tool-defined).'
  - '$unit: The compilation-unit scope; declarations in $unit are visible across the
    unit without import.'
  - 'Best practice: Prefer packages and explicit import over $unit to avoid hidden
    dependencies and name clashes.'
  notes: From MODULE5 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: Compilation Unit. Compilation unit: The
    scope of one or more source files compiled together (tool-defined). $unit: The
    compilation-unit scope; declarations in $unit are visible across the unit without
    import. Best practice: Prefer packages and explicit import over $unit to avoid
    hidden dependencies and name clashes. From MODULE5 Topics Covered — protocol/design
    depth.'
- type: bullets
  title: 'Detail: Package and Import'
  bullets:
  - 'Import: `import pkg::*` or `import pkg::item`; 2012 clarifies visibility and
    search order.'
  - 'Use: Keep shared types and functions in packages; import where needed; avoid
    relying on $unit for new code.'
  notes: From MODULE5 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: Package and Import. Import: import pkg::*
    or import pkg::item; 2012 clarifies visibility and search order. Use: Keep shared
    types and functions in packages; import where needed; avoid relying on $unit for
    new code. From MODULE5 Topics Covered — protocol/design depth.'
