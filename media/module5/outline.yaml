  - 'Array methods: `.size()`, `.delete()`, `.sort()`, `.reverse()`, etc. (exact set
    is revision-dependent).'
  - 'Queues: `.push_back()`, `.pop_front()`, `.insert()`, etc.'
  - 'Use in RTL: Limited (arrays in RTL are often fixed); methods are common in testbenches
    and checkers.'
  notes: From MODULE5 Topics Covered.
  narration: '3. Type and Operator Enhancements (2009/2012) (2/2). Array methods:
    .size(), .delete(), .sort(), .reverse(), etc. (exact set is revision-dependent).
    Queues: .push_back(), .pop_front(), .insert(), etc. Use in RTL: Limited (arrays
    in RTL are often fixed); methods are common in testbenches and checkers.'
- type: bullets
  title: 4. Array and String Refinements (2012)
  bullets:
  - 'Packed vs unpacked: Assignment rules and ordering (row-major, etc.) are clarified.'
  - 'Array copy: Whole-array assignment and copying; compatibility of dimensions.'
  - 'Use in RTL: Multi-dimensional arrays (e.g. memories) and parameterized dimensions;
    follow tool-supported subset for synthesis.'
  - 'Strings: `string` type; methods such as `.len()`, `.substr()`, `.atoi()`, etc.
    (as defined in 2012).'
  - 'Use in RTL: Rare (strings are mainly for messages and file I/O in testbenches).'
  - 'Use in testbenches: Logging, report generation, file names.'
  notes: From MODULE5 Topics Covered.
  narration: '4. Array and String Refinements (2012). Packed vs unpacked: Assignment
    rules and ordering (row-major, etc.) are clarified. Array copy: Whole-array assignment
    and copying; compatibility of dimensions. Use in RTL: Multi-dimensional arrays
    (e.g. memories) and parameterized dimensions; follow tool-supported subset for
    synthesis. Strings: string type; methods such as .len(), .substr(), .atoi()...'
- type: bullets
  title: 5. Assertions and Checkers in Context (2009/2012) (1/2)
  bullets:
  - 'immediate assertions: `assert (condition) else $error("...");` — checked when
    executed (like an if-check).'
  - 'concurrent assertions: `assert property (@(posedge clk) (a |-> b));` — checked
    over time; typically in verification.'
  - 'Use in RTL: Immediate assertions for invariants (e.g. one-hot, valid encodings);
    concurrent assertions often in bind files or testbench.'
  - 'checker: A reusable unit that can contain assertions, assumptions, coverage,
    and helper logic; can be instantiated in design or testbench.'
  - 'Use: Encapsulate a set of properties (e.g. protocol rules) and reuse across modules
    or hierarchies.'
  - 'Design: Checkers can be bound to RTL modules; they do not change RTL functionality,
    only add checking.'
  notes: From MODULE5 Topics Covered.
  narration: '5. Assertions and Checkers in Context (2009/2012) (1/2). immediate assertions:
    assert (condition) else $error("..."); — checked when executed (like an if-check).
    concurrent assertions: assert property (@(posedge clk) (a — -> b)); — checked
    over time; typically in verification. Use in RTL: Immediate assertions for invariants
    (e.g. one-hot, valid encodings); concurrent assertions often in bind...'
- type: bullets
  title: 5. Assertions and Checkers in Context (2009/2012) (2/2)
  bullets:
  - 'Synthesis: Checkers are typically not synthesized; they are for simulation and
    formal tools.'
  notes: From MODULE5 Topics Covered.
  narration: '5. Assertions and Checkers in Context (2009/2012) (2/2). Synthesis:
    Checkers are typically not synthesized; they are for simulation and formal tools.'
- type: bullets
  title: 6. Compilation Units and Scope (2012)
  bullets:
  - 'Compilation unit: The scope of one or more source files compiled together (tool-defined).'
  - '$unit: The compilation-unit scope; declarations in $unit are visible across the
    unit without import.'
  - 'Best practice: Prefer packages and explicit import over $unit to avoid hidden
    dependencies and name clashes.'
  - 'Import: `import pkg::*` or `import pkg::item`; 2012 clarifies visibility and
    search order.'
  - 'Use: Keep shared types and functions in packages; import where needed; avoid
    relying on $unit for new code.'
  notes: From MODULE5 Topics Covered.
  narration: '6. Compilation Units and Scope (2012). Compilation unit: The scope of
    one or more source files compiled together (tool-defined). $unit: The compilation-unit
    scope; declarations in $unit are visible across the unit without import. Best
    practice: Prefer packages and explicit import over $unit to avoid hidden dependencies
    and name clashes. Import: import pkg::* or import pkg::item; 2012 clarifies...'
