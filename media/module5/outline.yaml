- type: bullets
  title: 'Detail: What 1800-2009 Adds or Clarifies (1)'
  bullets:
  - 'Interfaces: Modport expressions, virtual interface type (for testbenches), interface
    inheritance'
  - 'Types and operators: Clarifications; additional operators and built-in methods'
  - 'Assertions: SVA enhancements; checker concept (preview)'
  - 'DPI: Refinements for C/C++ interop'
  notes: From MODULE5 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: What 1800-2009 Adds or Clarifies (1). Interfaces:
    Modport expressions, virtual interface type (for testbenches), interface inheritance
    Types and operators: Clarifications; additional operators and built-in methods
    Assertions: SVA enhancements; checker concept (preview) DPI: Refinements for C/C++
    interop From MODULE5 Topics Covered — protocol/design depth.'
- type: bullets
  title: 'Detail: What 1800-2009 Adds or Clarifies (2)'
  bullets:
  - 'Coverage: Coverage option and syntax clarifications'
  - 'Clarifications: Scheduling, generate, and other 2005 semantics'
  notes: From MODULE5 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: What 1800-2009 Adds or Clarifies (2). Coverage:
