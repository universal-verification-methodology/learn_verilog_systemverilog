  - Run the full module script — `./scripts/module5.sh` from the repo root to simulate
    all examples and tests.
  - Complete the exercises — Try each exercise in this document before reading solutions
    or peeking at reference RTL.
  notes: From docs/MODULE5.md — read guides before running demos.
