- type: code
  title: Embedded assertion example
  language: systemverilog
  source_file: module5/examples/assert_valid_encoding/assert_valid_encoding.sv
  code: "/*\n * Immediate assertion for valid encoding - IEEE 1800-2009/2012\n * assert\
    \ (valid_op) else $error; use for opcode or state encoding.\n */\n\nmodule alu_op\
    \ (\n    input  logic [2:0] op,\n    output logic [7:0] y\n);\n    /* Valid opcodes:\
    \ 0=add, 1=sub, 2=and, 3=or; others invalid */\n    logic valid_op;\n    always_comb\
    \ begin\n        valid_op = (op == 3'd0 || op == 3'd1 || op == 3'd2 || op == 3'd3);\n\
    \        assert (valid_op) else $error(\"alu_op: invalid opcode %d\", op);\n \
    \   end\n\n    always_comb begin\n        y = 8'b0;\n// ..."
  narration: Embedded assertion example. Review the code on screen and match it to
    files in the repository.
