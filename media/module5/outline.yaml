- type: code
  title: Immediate assertion in procedural code
  language: systemverilog
  source_file: module5/examples/checkers/immediate_assert.sv
  code: "/*\n * Immediate assertion - IEEE 1800-2009/2012\n * assert (condition) else\
    \ $error(\"...\"); checked when executed.\n */\n\nmodule onehot_check (\n    input\
    \  logic [3:0] sig,\n    output logic       valid\n);\n    /* Immediate assertion:\
    \ at most one bit set (one-hot or zero) */\n    always_comb begin\n        valid\
    \ = ($countones(sig) <= 1);\n        assert (valid) else $error(\"onehot_check:\
    \ sig not one-hot or zero: %b\", sig);\n    end\nendmodule\n\nmodule top;\n  \
    \  logic [3:0] sig;\n// ..."
  narration: Immediate assertion in procedural code. Review the code on screen and
    match it to files in the repository.
