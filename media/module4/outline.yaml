- type: code
  title: logic ports and always_comb
  language: systemverilog
  source_file: module4/examples/procedural/always_comb_ff.sv
  code: "/*\n * always_comb and always_ff - IEEE 1800-2005\n * Combinational: always_comb\
    \ (inferred sensitivity). Sequential: always_ff (one clock).\n */\n\nmodule always_comb_ff_demo\
    \ (\n    input  logic       clk,\n    input  logic       rst_n,\n    input  logic\
    \       a,\n    input  logic       b,\n    input  logic       c,\n    input  logic\
    \       d,\n    output logic       y_comb,\n    output logic       z_comb,\n \
    \   output logic       q\n);\n    /* Combinational: always_comb; no latch */\n\
    \    always_comb begin\n// ..."
  narration: logic ports and always_comb. Review the code on screen and match it to
    files in the repository.
- type: code
  title: Interface + modport connection
  language: systemverilog
  source_file: module4/examples/interfaces/bus_if_example.sv
  code: "/*\n * Interface and modports - IEEE 1800-2005\n * One bundle; modports define\
    \ direction per role.\n */\n\ninterface simple_bus_if;\n    logic [7:0] data;\n\
    \    logic        valid;\n    logic        ready;\n    logic        clk;\n   \
    \ logic        rst_n;\n\n    modport master (output data, valid, input ready,\
    \ clk, rst_n);\n    modport slave  (input data, valid, output ready, input clk,\
    \ rst_n);\nendinterface\n\nmodule producer (simple_bus_if.master m);\n    always_ff\
    \ @(posedge m.clk) begin\n// ..."
  narration: Interface + modport connection. Review the code on screen and match it
    to files in the repository.
