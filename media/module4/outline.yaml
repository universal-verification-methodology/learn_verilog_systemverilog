- type: bullets
  title: Overview
  bullets:
  - 'This module covers IEEE Std 1800-2005, the first SystemVerilog standard. It extends
    Verilog (IEEE 1364-2005) with design and verification features. Here the focus
    is on the **design subset** used for RTL: the `logic` typ'
