- type: bullets
  title: 2. logic and 2-State Types (1800) (1/2)
  bullets:
  - 'logic: Replaces `wire` and `reg` when there is a single driver; can be used in
    both continuous and procedural assignments.'
  - 'Rule: A `logic` variable must have exactly one driver (one assign, or one always
    block, or one port connection).'
  - '4-state: 0, 1, X, Z (same as wire/reg).'
  - 'Ports: `input logic`, `output logic`; no need to choose wire vs reg for single-driver
    ports.'
  - 'Internal: Use `logic` for single-driver signals; use `wire` only when needed
    (e.g. multiple drivers, tri-state).'
  - 'bit: 2-state (0, 1); no X or Z. Often used in testbenches and for indices.'
  notes: From MODULE4 Topics Covered.
  narration: '2. logic and 2-State Types (1800) (1/2). logic: Replaces wire and reg
    when there is a single driver; can be used in both continuous and procedural assignments.
    Rule: A logic variable must have exactly one driver (one assign, or one always
    block, or one port connection). 4-state: 0, 1, X, Z (same as wire/reg). Ports:
    input logic, output logic; no need to choose wire vs reg for single-driver...'
- type: bullets
  title: 2. logic and 2-State Types (1800) (2/2)
  bullets:
  - 'int, byte, shortint, longint: Integer types; 2-state unless declared with a 4-state
    base.'
  - 'Use in RTL: Optional (e.g. loop indices, parameters); many RTL designs use `logic`
    and `integer`/`reg` for compatibility.'
  notes: From MODULE4 Topics Covered.
  narration: '2. logic and 2-State Types (1800) (2/2). int, byte, shortint, longint:
    Integer types; 2-state unless declared with a 4-state base. Use in RTL: Optional
    (e.g. loop indices, parameters); many RTL designs use logic and integer/reg for
    compatibility.'
- type: bullets
  title: 3. always_comb, always_ff, always_latch (1800) (1/2)
  bullets:
  - 'Intent: Combinational logic; no storage; outputs are a function of inputs only.'
  - 'Sensitivity: Automatically inferred (like `always @*`); must not contain latches.'
  - 'Tool check: Simulator/synthesis can warn if the block implies storage or is sensitive
    to clock edges.'
  - 'Prefer over `always @*` when the tool supports it: clearer intent and better
    checking.'
  - 'Intent: Sequential logic (flip-flops); use nonblocking assignment (`<=`) only.'
  - 'Sensitivity: Must list exactly one clock (and optionally async reset); no other
    event controls.'
  notes: From MODULE4 Topics Covered.
  narration: '3. always_comb, always_ff, always_latch (1800) (1/2). Intent: Combinational
    logic; no storage; outputs are a function of inputs only. Sensitivity: Automatically
    inferred (like always @*); must not contain latches. Tool check: Simulator/synthesis
    can warn if the block implies storage or is sensitive to clock edges. Prefer over
    always @* when the tool supports it: clearer intent and better...'
- type: bullets
  title: 3. always_comb, always_ff, always_latch (1800) (2/2)
  bullets:
  - 'Tool check: Can warn if blocking assignment or incomplete sensitivity is used.'
  - 'Intent: Explicit latch (level-sensitive storage). Use sparingly; usually latches
    are unintended.'
  - 'When: When a latch is truly intended (e.g. transparent latch); otherwise use
    always_comb or always_ff.'
  - 'Recommendation: Prefer always_comb or always_ff; use always_latch only when a
    latch is desired.'
  notes: From MODULE4 Topics Covered.
  narration: '3. always_comb, always_ff, always_latch (1800) (2/2). Tool check: Can
    warn if blocking assignment or incomplete sensitivity is used. Intent: Explicit
    latch (level-sensitive storage). Use sparingly; usually latches are unintended.
    When: When a latch is truly intended (e.g. transparent latch); otherwise use always_comb
    or always_ff. Recommendation: Prefer always_comb or always_ff; use...'
- type: bullets
  title: 4. Interfaces and Modports (1800)
  bullets:
  - 'Signals: Declared once inside the interface; shared by all modules that use it.'
  - 'modport: Defines a view (direction) for a given role (e.g. master sees data as
    output, slave sees data as input).'
  - 'Port: Single interface port with a modport (e.g. `bus_if.master bus`).'
  - 'Access: `bus.signal_name`; direction is enforced by the modport.'
  - 'One interface instance: Connects master and slave; no long port lists.'
  notes: From MODULE4 Topics Covered.
  narration: '4. Interfaces and Modports (1800). Signals: Declared once inside the
    interface; shared by all modules that use it. modport: Defines a view (direction)
    for a given role (e.g. master sees data as output, slave sees data as input).
    Port: Single interface port with a modport (e.g. bus_if.master bus). Access: bus.signal_name;
    direction is enforced by the modport. One interface instance: Connects...'
- type: bullets
  title: 5. Packages and import (1800)
  bullets:
  - 'Contents: parameter, localparam, typedef, function, task, etc. (no always blocks).'
  - 'Scope: Items are in namespace `pkg_util::` until imported.'
  - 'import pkg_util::*: Import all names from the package (can cause name clashes).'
  - 'import pkg_util::item: Import specific items; safer when many packages are used.'
  notes: From MODULE4 Topics Covered.
  narration: '5. Packages and import (1800). Contents: parameter, localparam, typedef,
    function, task, etc. (no always blocks). Scope: Items are in namespace pkg_util::
    until imported. import pkg_util::*: Import all names from the package (can cause
    name clashes). import pkg_util::item: Import specific items; safer when many packages
    are used.'
- type: bullets
  title: 6. unique case and priority case (1800)
  bullets:
  - 'Semantics: At most one case item must match at runtime; if none or more than
    one matches, a runtime error can be reported.'
  - 'Use: When the design guarantees at most one match (e.g. one-hot encoding, mutually
    exclusive conditions).'
  - 'Synthesis: Can be implemented as parallel priority logic; no inferred priority
    order.'
  - 'Semantics: The first matching item has priority; if no item matches, a runtime
    error can be reported (unless default is present).'
  - 'Use: When priority order is intended (e.g. interrupt mask).'
  - 'Synthesis: Can be implemented as a priority chain (if-then-else or similar).'
  notes: From MODULE4 Topics Covered.
  narration: '6. unique case and priority case (1800). Semantics: At most one case
    item must match at runtime; if none or more than one matches, a runtime error
