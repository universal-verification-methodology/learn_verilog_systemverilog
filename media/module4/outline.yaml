- type: section
  title: Common pitfalls
- type: bullets
  title: Multiple Drivers on logic
  bullets:
  - 'Mistake: Driving the same logic from two assign statements or two always blocks.'
  - 'Reality: logic allows only one driver; multiple drivers are illegal or undefined.'
  - 'Correct: Use one assign or one always per logic; for multiple drivers use wire
    (e.g. tri-state).'
  - 'Why: logic is for single-driver RTL; wire is for resolved (multi-driver) nets.'
  notes: From MODULE4 Common Pitfalls.
- type: bullets
  title: Using always_comb with Latched Behavior
  bullets:
  - 'Mistake: Incomplete branches in always_comb (e.g. no default in case) and expecting
    no latch.'
  - 'Reality: Tools may infer a latch or report a warning.'
  - 'Correct: Assign every output in every path, or provide default before case.'
  - 'Why: always_comb is intended for pure combinational logic; latches require always_latch
    if desired.'
  notes: From MODULE4 Common Pitfalls.
- type: bullets
  title: Wrong Modport or Direction
  bullets:
  - 'Mistake: Driving an input in a modport or reading an output that is not in the
    modport.'
  - 'Reality: Compiler or elaboration error; or wrong connectivity.'
  - 'Correct: Use the modport that matches the module role (master vs slave); check
    direction in the interface.'
  - 'Why: Modports enforce direction; using the wrong view breaks the contract.'
  notes: From MODULE4 Common Pitfalls.
- type: bullets
  title: Forgetting to import Package
  bullets:
  - 'Mistake: Using a package type or function without importing.'
  - 'Reality: Identifier not found; compile error.'
  - 'Correct: Add `import pkg_name::*;` or `import pkg_name::item;` before use.'
  - 'Why: Package names are in a separate namespace until imported.'
  notes: From MODULE4 Common Pitfalls.
- type: bullets
  title: unique case with Multiple Matches
  bullets:
  - 'Mistake: Writing unique case when two items can match (e.g. overlapping or X
    in select).'
  - 'Reality: Runtime error or undefined behavior.'
  - 'Correct: Use unique case only when at most one item can match; use default for
    catch-all; or use priority case when priority is i'
  - 'Why: unique case has well-defined semantics; violating them breaks verification
    and synthesis.'
  notes: From MODULE4 Common Pitfalls.
