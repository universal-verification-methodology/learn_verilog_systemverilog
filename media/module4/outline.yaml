- type: code
  title: Package import pattern
  language: systemverilog
  source_file: module4/examples/packages/pkg_util.sv
  code: "/*\n * Package and import - IEEE 1800-2005\n * Shared types, parameters,\
    \ functions.\n */\n\npackage pkg_util;\n    parameter int WIDTH = 8;\n    typedef\
    \ logic [WIDTH-1:0] word_t;\n\n    function automatic logic [7:0] parity(input\
    \ logic [31:0] v);\n        parity = ^v;\n    endfunction\nendpackage\n\nmodule\
    \ alu (\n    input  logic [31:0] a,\n    input  logic [31:0] b,\n    output logic\
    \ [31:0] y,\n// ..."
