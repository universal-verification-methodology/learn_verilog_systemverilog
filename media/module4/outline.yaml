- type: bullets
  title: 'Detail: What 1800-2005 Adds Over 1364-2005 (Design Subset) (2)'
  bullets:
  - 'Packages and import: Shared types, constants, and functions across modules'
  - 'unique case, priority case: Standard semantics for case statements (no tool-specific
    attributes)'
  - 'Operators: `inside`, wildcard `==?`, and other enhancements'
  - 'Verification: Classes, assertions (SVA), coverage, etc. (covered in later modules
