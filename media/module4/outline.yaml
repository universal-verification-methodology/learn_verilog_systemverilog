- type: bullets
  title: 'Detail: Relation to 1364-2005'
  bullets:
  - 1364-2005 (Verilog) is a subset of 1800-2005 (SystemVerilog).
  - Valid 1364-2005 RTL is valid 1800-2005 RTL; you can migrate incrementally (e.g.
    wire→logic, always @*→always_comb).
  notes: From MODULE4 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: Relation to 1364-2005. 1364-2005 (Verilog)
    is a subset of 1800-2005 (SystemVerilog). Valid 1364-2005 RTL is valid 1800-2005
    RTL; you can migrate incrementally (e.g. wire→logic, always @*→always_comb). From
    MODULE4 Topics Covered — protocol/design depth.'
- type: bullets
  title: 'Detail: logic (4-State, Single Driver) (1)'
  bullets:
  - 'logic: Replaces `wire` and `reg` when there is a single driver; can be used in
    both continuous and procedural assignments.'
  - 'Rule: A `logic` variable must have exactly one driver (one assign, or one always
    block, or one port connection).'
  - '4-state: 0, 1, X, Z (same as wire/reg).'
  - 'Ports: `input logic`, `output logic`; no need to choose wire vs reg for single-driver
    ports.'
  notes: From MODULE4 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: logic (4-State, Single Driver) (1). logic:
    Replaces wire and reg when there is a single driver; can be used in both continuous
    and procedural assignments. Rule: A logic variable must have exactly one driver
    (one assign, or one always block, or one port connection). 4-state: 0, 1, X, Z
    (same as wire/reg). Ports: input logic, output logic; no need to choose wire vs...'
- type: bullets
  title: 'Detail: logic (4-State, Single Driver) (2)'
  bullets:
  - 'Internal: Use `logic` for single-driver signals; use `wire` only when needed
    (e.g. multiple drivers, tri-state).'
  notes: From MODULE4 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: logic (4-State, Single Driver) (2). Internal:
    Use logic for single-driver signals; use wire only when needed (e.g. multiple
    drivers, tri-state). From MODULE4 Topics Covered — protocol/design depth.'
- type: bullets
  title: 'Detail: bit and 2-State Types (1800)'
  bullets:
  - 'bit: 2-state (0, 1); no X or Z. Often used in testbenches and for indices.'
  - 'int, byte, shortint, longint: Integer types; 2-state unless declared with a 4-state
    base.'
  - 'Use in RTL: Optional (e.g. loop indices, parameters); many RTL designs use `logic`
    and `integer`/`reg` for compatibility.'
  notes: From MODULE4 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: bit and 2-State Types (1800). bit: 2-state
    (0, 1); no X or Z. Often used in testbenches and for indices. int, byte, shortint,
    longint: Integer types; 2-state unless declared with a 4-state base. Use in RTL:
    Optional (e.g. loop indices, parameters); many RTL designs use logic and integer/reg
    for compatibility. From MODULE4 Topics Covered — protocol/design depth.'
- type: bullets
  title: 'Detail: always_comb'
  bullets:
  - 'Intent: Combinational logic; no storage; outputs are a function of inputs only.'
  - 'Sensitivity: Automatically inferred (like `always @*`); must not contain latches.'
  - 'Tool check: Simulator/synthesis can warn if the block implies storage or is sensitive
    to clock edges.'
  - 'Prefer over `always @*` when the tool supports it: clearer intent and better
    checking.'
  notes: From MODULE4 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: always_comb. Intent: Combinational logic;
    no storage; outputs are a function of inputs only. Sensitivity: Automatically
    inferred (like always @*); must not contain latches. Tool check: Simulator/synthesis
    can warn if the block implies storage or is sensitive to clock edges. Prefer over
    always @* when the tool supports it: clearer intent and better checking. From...'
- type: bullets
  title: 'Detail: always_ff'
  bullets:
  - 'Intent: Sequential logic (flip-flops); use nonblocking assignment (`<=`) only.'
  - 'Sensitivity: Must list exactly one clock (and optionally async reset); no other
    event controls.'
  - 'Tool check: Can warn if blocking assignment or incomplete sensitivity is used.'
  notes: From MODULE4 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: always_ff. Intent: Sequential logic (flip-flops);
    use nonblocking assignment (<=) only. Sensitivity: Must list exactly one clock
    (and optionally async reset); no other event controls. Tool check: Can warn if
    blocking assignment or incomplete sensitivity is used. From MODULE4 Topics Covered
    — protocol/design depth.'
- type: bullets
  title: 'Detail: always_latch'
  bullets:
  - 'Intent: Explicit latch (level-sensitive storage). Use sparingly; usually latches
    are unintended.'
  - 'When: When a latch is truly intended (e.g. transparent latch); otherwise use
    always_comb or always_ff.'
  - 'Recommendation: Prefer always_comb or always_ff; use always_latch only when a
    latch is desired.'
  notes: From MODULE4 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: always_latch. Intent: Explicit latch (level-sensitive
    storage). Use sparingly; usually latches are unintended. When: When a latch is
    truly intended (e.g. transparent latch); otherwise use always_comb or always_ff.
    Recommendation: Prefer always_comb or always_ff; use always_latch only when a
    latch is desired. From MODULE4 Topics Covered — protocol/design depth.'
- type: bullets
  title: 'Detail: Interface Declaration'
  bullets:
  - 'Signals: Declared once inside the interface; shared by all modules that use it.'
  - 'modport: Defines a view (direction) for a given role (e.g. master sees data as
    output, slave sees data as input).'
  notes: From MODULE4 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: Interface Declaration. Signals: Declared
    once inside the interface; shared by all modules that use it. modport: Defines
    a view (direction) for a given role (e.g. master sees data as output, slave sees
    data as input). From MODULE4 Topics Covered — protocol/design depth.'
- type: bullets
  title: 'Detail: Using an Interface in a Module'
  bullets:
  - 'Port: Single interface port with a modport (e.g. `bus_if.master bus`).'
  - 'Access: `bus.signal_name`; direction is enforced by the modport.'
  notes: From MODULE4 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: Using an Interface in a Module. Port: Single
    interface port with a modport (e.g. bus_if.master bus). Access: bus.signal_name;
    direction is enforced by the modport. From MODULE4 Topics Covered — protocol/design
    depth.'
- type: bullets
  title: 'Detail: Top-Level Connection'
  bullets:
  - 'One interface instance: Connects master and slave; no long port lists.'
  notes: From MODULE4 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: Top-Level Connection. One interface instance:
    Connects master and slave; no long port lists. From MODULE4 Topics Covered — protocol/design
    depth.'
- type: bullets
  title: 'Detail: Package Declaration'
  bullets:
  - 'Contents: parameter, localparam, typedef, function, task, etc. (no always blocks).'
  - 'Scope: Items are in namespace `pkg_util::` until imported.'
  notes: From MODULE4 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: Package Declaration. Contents: parameter,
    localparam, typedef, function, task, etc. (no always blocks). Scope: Items are
    in namespace pkg_util:: until imported. From MODULE4 Topics Covered — protocol/design
    depth.'
- type: bullets
  title: 'Detail: Import and Use'
  bullets:
  - 'import pkg_util::*: Import all names from the package (can cause name clashes).'
  - 'import pkg_util::item: Import specific items; safer when many packages are used.'
  notes: From MODULE4 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: Import and Use. import pkg_util::*: Import
    all names from the package (can cause name clashes). import pkg_util::item: Import
    specific items; safer when many packages are used. From MODULE4 Topics Covered
    — protocol/design depth.'
- type: bullets
  title: 'Detail: unique case'
  bullets:
  - 'Semantics: At most one case item must match at runtime; if none or more than
    one matches, a runtime error can be reported.'
  - 'Use: When the design guarantees at most one match (e.g. one-hot encoding, mutually
    exclusive conditions).'
  - 'Synthesis: Can be implemented as parallel priority logic; no inferred priority
    order.'
  notes: From MODULE4 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: unique case. Semantics: At most one case
    item must match at runtime; if none or more than one matches, a runtime error
    can be reported. Use: When the design guarantees at most one match (e.g. one-hot
    encoding, mutually exclusive conditions). Synthesis: Can be implemented as parallel
    priority logic; no inferred priority order. From MODULE4 Topics Covered —...'
- type: bullets
  title: 'Detail: priority case'
  bullets:
  - 'Semantics: The first matching item has priority; if no item matches, a runtime
    error can be reported (unless default is present).'
  - 'Use: When priority order is intended (e.g. interrupt mask).'
  - 'Synthesis: Can be implemented as a priority chain (if-then-else or similar).'
  notes: From MODULE4 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: priority case. Semantics: The first matching
    item has priority; if no item matches, a runtime error can be reported (unless
    default is present). Use: When priority order is intended (e.g. interrupt mask).
    Synthesis: Can be implemented as a priority chain (if-then-else or similar). From
    MODULE4 Topics Covered — protocol/design depth.'
