- type: section
  title: Common pitfalls
- type: bullets
  title: Assuming 1364 Is Still a Separate Standard
  bullets:
  - 'Mistake: Citing "IEEE 1364-2005" as the current Verilog standard for new designs.'
  - 'Reality: 1364 is merged into 1800-2017; new work should reference 1800-2017 (and
    use a subset if Verilog-only is required).'
  - 'Correct: Use "1800-2017" as the reference; say "Verilog subset of 1800-2017"
    when restricting to non-SystemVerilog.'
  - 'Why: Avoids confusion and ensures one LRM for all language questions.'
  notes: From MODULE6 Common Pitfalls.
- type: bullets
  title: Mixing Revisions in One Project
  bullets:
  - 'Mistake: Using 1800-2017 in one file and 1800-2005-only in another without a
    clear subset rule.'
  - 'Reality: Can lead to tool-dependent behavior or subtle bugs.'
  - 'Correct: Define one project standard (e.g. 1800-2017) and a subset (e.g. design
    only, no SVA in RTL); apply consistently.'
  - 'Why: Predictable tool behavior and easier maintenance.'
  notes: From MODULE6 Common Pitfalls.
- type: bullets
  title: Ignoring Tool Support
  bullets:
  - 'Mistake: Writing 1800-2017 syntax that the synthesis or simulation tool does
    not support.'
  - 'Reality: Compile or elaboration errors; or tool-specific interpretation.'
  - 'Correct: Check tool documentation for supported LRM revision and synthesizable
    subset; restrict code to that.'
  - 'Why: Ensures portability and correct results.'
  notes: From MODULE6 Common Pitfalls.
- type: bullets
  title: Assertions in Synthesis
  bullets:
  - 'Mistake: Expecting concurrent assertions or complex checkers to be synthesized.'
  - 'Reality: Most assertion/checker logic is for simulation and formal; not for netlist.'
  - 'Correct: Use immediate assertions for simple invariants if the tool supports
    them in RTL; keep heavy checking in testbench or bin'
  - 'Why: Synthesis tools typically ignore or strip assertions; RTL should remain
    synthesizable.'
  notes: From MODULE6 Common Pitfalls.
- type: bullets
  title: Over-Migrating Legacy Code
  bullets:
  - 'Mistake: Converting all legacy 1364 RTL to 1800 (logic, interfaces, etc.) without
    need.'
  - 'Reality: Risk of introducing bugs; effort may not pay off if the block is stable
    and Verilog-only is sufficient.'
  - 'Correct: Migrate when adding features, fixing bugs, or when the project standard
    moves to 1800; otherwise leave stable 1364 RTL a'
  - 'Why: Balance benefit (readability, tool checking) with risk and effort.'
  notes: From MODULE6 Common Pitfalls.
