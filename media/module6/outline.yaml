- type: bullets
  title: 'Detail: logic and Single Driver'
  bullets:
  - 'Rule: logic must have exactly one driver (one assign, one always block, or one
    port connection).'
  - '2017: Semantics of multiple drivers, resolution, and connection rules are clarified
    in the LRM.'
  notes: From MODULE6 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: logic and Single Driver. Rule: logic must
    have exactly one driver (one assign, one always block, or one port connection).
    2017: Semantics of multiple drivers, resolution, and connection rules are clarified
    in the LRM. From MODULE6 Topics Covered — protocol/design depth.'
- type: bullets
  title: 'Detail: always_comb, always_ff, always_latch'
  bullets:
  - 'Intent: Combinational, sequential (flip-flop), or latch; tools can check and
    warn.'
  - '2017: Execution order, sensitivity, and interaction with other processes are
    clarified.'
  notes: From MODULE6 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: always_comb, always_ff, always_latch. Intent:
