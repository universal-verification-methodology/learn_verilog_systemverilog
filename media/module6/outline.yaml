- type: bullets
  title: 'Detail: Immediate and Concurrent Assertions'
  bullets:
  - 'Immediate: `assert (condition);` — executed when reached; useful for invariants
    in RTL.'
  - 'Concurrent: `assert property (...);` — temporal; used in verification and bind
    files.'
  - '2017: Property syntax, scheduling, and binding are clarified.'
  notes: From MODULE6 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: Immediate and Concurrent Assertions. Immediate:
