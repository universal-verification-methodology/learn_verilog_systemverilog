  bullets:
  - ✓ Describe IEEE 1800-2017 as the unified LRM (Verilog + SystemVerilog in one standard)
  - ✓ Explain "Verilog" as a subset of 1800-2017 and when to use Verilog-only vs SystemVerilog
    design
  - ✓ Recap design constructs (logic, always_comb/always_ff, interfaces, packages,
    unique/priority case) in 2017 context
  - ✓ Use immediate assertions in RTL appropriately; understand SVA/checker context
  - ✓ Summarize the version timeline (1364-1995 through 1800-2017) and choose a standard
    for a project
  - ✓ Plan simple migration from older Verilog or SystemVerilog to 1800-2017
  notes: From MODULE6 Learning Outcomes.
