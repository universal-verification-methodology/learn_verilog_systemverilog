- type: bullets
  title: 'Detail: Choosing a Standard'
  bullets:
  - 'Legacy or Verilog-only flow: Use 1364-2005 subset (no SystemVerilog) or document
    "Verilog as per 1800-2017 subset."'
  - 'New RTL with SystemVerilog: Use 1800-2017 (or 2012/2009 if tool lags); adopt
    logic, always_comb/always_ff, interfaces, packages as needed.'
  - 'Verification: Use 1800-2017 (or supported revision) for SVA, checkers, coverage,
    classes.'
  - 'Single revision: Prefer one stated revision (e.g. "1800-2017") for the project
    to avoid mixed semantics.'
  notes: From MODULE6 Topics Covered — protocol/design depth.
