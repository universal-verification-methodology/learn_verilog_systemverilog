    From MODULE6 Topics Covered — protocol/design depth.'
- type: bullets
  title: 'Detail: Interfaces and Modports'
  bullets:
  - 'Use: Bundle signals; modports define direction per role.'
  - '2017: Interface connection, parameterization, and modport rules are refined.'
  notes: From MODULE6 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: Interfaces and Modports. Use: Bundle signals;
    modports define direction per role. 2017: Interface connection, parameterization,
