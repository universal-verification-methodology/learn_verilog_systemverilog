- type: code
  title: logic single-driver pattern
  language: systemverilog
  source_file: module6/examples/logic_single_driver/logic_single_driver.sv
  code: "/*\n * IEEE 1800-2017: logic and single driver (2017 clarified)\n * logic\
    \ must have exactly one driver; comb and seq in separate blocks.\n */\n\nmodule\
    \ comb_block (\n    input  logic [7:0] a,\n    input  logic [7:0] b,\n    output\
    \ logic [7:0] sum,\n    output logic       eq\n);\n    assign sum = a + b;\n \
    \   always_comb eq = (a == b);\nendmodule\n\nmodule seq_block (\n    input  logic\
    \       clk,\n    input  logic       rst,\n// ..."
  narration: logic single-driver pattern. Review the code on screen and match it to
    files in the repository.
