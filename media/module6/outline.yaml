- type: bullets
  title: 'Detail: Packages and import'
  bullets:
  - 'Use: Shared types, constants, functions; explicit namespace.'
  - '2017: Import scope, search order, and compilation-unit interaction are clarified.'
  notes: From MODULE6 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: Packages and import. Use: Shared types,
    constants, functions; explicit namespace. 2017: Import scope, search order, and
    compilation-unit interaction are clarified. From MODULE6 Topics Covered — protocol/design
    depth.'
- type: bullets
  title: 'Detail: unique case and priority case'
  bullets:
  - 'Semantics: At most one match (unique) or first match wins (priority); runtime
    checks possible.'
  - '2017: Case statement semantics and synthesis mapping are clarified.'
  notes: From MODULE6 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: unique case and priority case. Semantics:
