- type: bullets
  title: 'Detail: Generally Not Synthesizable (or Tool-Specific) (2)'
  bullets:
  - 'System tasks: e.g. `$display`, `$finish` — testbench/simulation only.'
  - 'Pure latch inference: Unintended latches from incomplete case/if; use full case
    or default.'
  notes: From MODULE3 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: Generally Not Synthesizable (or Tool-Specific)
