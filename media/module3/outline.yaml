- type: code
  title: Parameter override at instantiation
  language: systemverilog
  source_file: module3/examples/parameters/param_override.v
  code: "/*\n * Parameter override at instantiation - IEEE 1364-2005\n * No defparam\
    \ (deprecated); use #(.PARAM(value)) at instantiation only.\n */\n\nmodule adder\
    \ #(parameter WIDTH = 8) (\n    input  wire [WIDTH-1:0] a,\n    input  wire [WIDTH-1:0]\
    \ b,\n    output wire [WIDTH-1:0] y\n);\n    assign y = a + b;\nendmodule\n\n\
    module top;\n    reg [3:0] a4, b4;\n    reg [7:0] a8, b8;\n    wire [3:0] y4;\n\
    \    wire [7:0] y8;\n// ..."
  narration: Parameter override at instantiation. Review the code on screen and match
    it to files in the repository.
