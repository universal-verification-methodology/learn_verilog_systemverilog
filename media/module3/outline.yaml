- type: bullets
  title: 'Detail: Best Practices for Synthesis (1364-2005)'
  bullets:
  - 'Combinational: Use `always @*` and blocking `=`; assign all outputs in all branches
    (or default) to avoid latches.'
  - 'Sequential: Use `always @(posedge clk)` (and optionally `negedge rst_n`) and
    nonblocking `<=`; do not mix blocking and nonblocking for...'
  - 'One driver per net: No multiple assign to the same wire; no multiple always driving
    the same reg in conflicting ways.'
  - 'Avoid latches: In combinational always, cover all cases or use a default assignment.'
  notes: From MODULE3 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: Best Practices for Synthesis (1364-2005).
    Combinational: Use always @* and blocking =; assign all outputs in all branches
    (or default) to avoid latches. Sequential: Use always @(posedge clk) (and optionally
    negedge rst_n) and nonblocking <=; do not mix blocking and nonblocking for...
    One driver per net: No multiple assign to the same wire; no multiple always driving...'
- type: bullets
  title: 'Detail: Rules of Thumb'
  bullets:
  - 'Combinational always (`always @*`): Use blocking `=`. Order of statements can
    matter (same simulation time step).'
  - 'Sequential always (`always @(posedge clk)`): Use nonblocking `<=`. Order does
    not matter within the block; updates occur at the end of...'
  - Do not mix blocking and nonblocking for the same variable in the same always block.
  notes: From MODULE3 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: Rules of Thumb. Combinational always (always
    @*): Use blocking =. Order of statements can matter (same simulation time step).
    Sequential always (always @(posedge clk)): Use nonblocking <=. Order does not
    matter within the block; updates occur at the end of... Do not mix blocking and
    nonblocking for the same variable in the same always block. From MODULE3 Topics...'
- type: bullets
  title: 'Detail: full_case (Tool-Dependent)'
  bullets:
  - 'Intent: “Every possible case value is covered; no latch.”'
  - 'Syntax: Often an attribute, e.g. `(* full_case *)` or tool-specific comment.'
  - 'Use: When the designer guarantees all cases are covered (e.g. one-hot state encoding).'
  notes: From MODULE3 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: full_case (Tool-Dependent). Intent: “Every
    possible case value is covered; no latch.” Syntax: Often an attribute, e.g. (*
    full_case *) or tool-specific comment. Use: When the designer guarantees all cases
    are covered (e.g. one-hot state encoding). From MODULE3 Topics Covered — protocol/design
    depth.'
- type: bullets
  title: 'Detail: parallel_case (Tool-Dependent)'
  bullets:
  - 'Intent: “At most one case arm matches; can be implemented as parallel mux.”'
  - 'Syntax: Often an attribute, e.g. `(* parallel_case *)` or tool-specific.'
  - 'Use: When at most one branch is true (e.g. one-hot); misuse can hide bugs.'
  notes: From MODULE3 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: parallel_case (Tool-Dependent). Intent:
    “At most one case arm matches; can be implemented as parallel mux.” Syntax: Often
    an attribute, e.g. (* parallel_case *) or tool-specific. Use: When at most one
    branch is true (e.g. one-hot); misuse can hide bugs. From MODULE3 Topics Covered
    — protocol/design depth.'
