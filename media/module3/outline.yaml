- type: section
  title: Common pitfalls
  narration: 'Next section: Common pitfalls.'
- type: bullets
  title: Using defparam in New Code
  bullets:
  - 'Mistake: Overriding parameters with defparam for convenience.'
  - 'Reality: defparam is deprecated in 1364-2005; tools may warn or restrict.'
  - 'Correct: Override at instantiation: `sub #(.WIDTH(16)) u_sub (...);`'
  - 'Why: Clear, hierarchical parameter flow; better for synthesis and maintenance.'
  notes: From MODULE3 Common Pitfalls.
  narration: 'Using defparam in New Code. Mistake: Overriding parameters with defparam
    for convenience. Reality: defparam is deprecated in 1364-2005; tools may warn
    or restrict. Correct: Override at instantiation: sub #(.WIDTH(16)) u_sub (...);
    Why: Clear, hierarchical parameter flow; better for synthesis and maintenance.'
- type: bullets
  title: Mixing Blocking and Nonblocking for Same Variable
  bullets:
  - 'Mistake: Using both `=` and `<=` for the same reg in one always block.'
  - 'Reality: Leads to simulation/synthesis mismatch and race conditions.'
  - 'Correct: Use only `=` in combinational always; only `<=` in sequential always
    for that variable.'
  - 'Why: 1364-2005 semantics assume consistent use; mixing is undefined in practice.'
  notes: From MODULE3 Common Pitfalls.
  narration: 'Mixing Blocking and Nonblocking for Same Variable. Mistake: Using both
    = and <= for the same reg in one always block. Reality: Leads to simulation/synthesis
    mismatch and race conditions. Correct: Use only = in combinational always; only
    <= in sequential always for that variable. Why: 1364-2005 semantics assume consistent
    use; mixing is undefined in practice.'
- type: bullets
  title: Assuming unique/priority case in 1364-2005
  bullets:
  - 'Mistake: Writing `unique case` or `priority case` (SystemVerilog) and expecting
    1364-2005 tools to support it.'
  - 'Reality: Those keywords are in IEEE 1800, not 1364.'
  - 'Correct: Use full_case/parallel_case attributes if the tool supports them; otherwise
    ensure full coverage and document intent.'
  - 'Why: Avoids tool errors and clarifies design intent.'
  notes: From MODULE3 Common Pitfalls.
  narration: 'Assuming unique/priority case in 1364-2005. Mistake: Writing unique
    case or priority case (SystemVerilog) and expecting 1364-2005 tools to support
    it. Reality: Those keywords are in IEEE 1800, not 1364. Correct: Use full_case/parallel_case
    attributes if the tool supports them; otherwise ensure full coverage and document
    intent. Why: Avoids tool errors and clarifies design intent.'
- type: bullets
  title: Latches from Incomplete case/if
  bullets:
  - 'Mistake: Combinational always with case or if that does not assign in all paths.'
  - 'Reality: Synthesis infers a latch; simulation may hold previous value.'
  - 'Correct: Assign default before case, or cover all cases; avoid incomplete if/else.'
  - 'Why: Latches are rarely intended in synchronous RTL; explicit defaults avoid
    them.'
  notes: From MODULE3 Common Pitfalls.
  narration: 'Latches from Incomplete case/if. Mistake: Combinational always with
    case or if that does not assign in all paths. Reality: Synthesis infers a latch;
    simulation may hold previous value. Correct: Assign default before case, or cover
    all cases; avoid incomplete if/else. Why: Latches are rarely intended in synchronous
    RTL; explicit defaults avoid them.'
- type: bullets
  title: Using SystemVerilog in “1364-2005” Project
  bullets:
  - 'Mistake: Using `logic`, `always_comb`, or interfaces while targeting “Verilog
    only.”'
  - 'Reality: Those are 1800 (SystemVerilog); 1364-2005 does not define them.'
  - 'Correct: Use wire/reg and always @* / always @(posedge clk) for strict 1364-2005.'
  - 'Why: Keeps tool and project consistently on one standard.'
  notes: From MODULE3 Common Pitfalls.
  narration: 'Using SystemVerilog in “1364-2005” Project. Mistake: Using logic, always_comb,
    or interfaces while targeting “Verilog only.” Reality: Those are 1800 (SystemVerilog);
    1364-2005 does not define them. Correct: Use wire/reg and always @* / always @(posedge
    clk) for strict 1364-2005. Why: Keeps tool and project consistently on one standard.'
