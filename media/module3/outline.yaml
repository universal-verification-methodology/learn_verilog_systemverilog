- type: bullets
  title: 'Detail: Generally Synthesizable (RTL Subset) (1)'
  bullets:
  - 'Modules: ANSI ports, parameter, localparam.'
  - 'Nets and variables: wire, reg (with correct usage).'
  - 'assign: Combinational logic; single driver per net.'
  - 'always: Combinational with `always @*`; sequential with `always @(posedge clk)`
    (or negedge) and nonblocking `<=`.'
