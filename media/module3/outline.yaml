- type: code
  title: 'Avoid defparam — use #() instead'
  language: systemverilog
  source_file: module3/examples/no_defparam/no_defparam.v
  code: "/*\n * No defparam - IEEE 1364-2005\n * defparam is deprecated; override\
    \ only at instantiation.\n * This example shows correct hierarchy: parent passes\
    \ parameter to child at inst.\n */\n\nmodule child #(parameter W = 4) (\n    input\
    \  wire [W-1:0] a,\n    output wire [W-1:0] y\n);\n    assign y = a;\nendmodule\n\
    \nmodule parent #(parameter W = 4) (\n    input  wire [W-1:0] a,\n    output wire\
    \ [W-1:0] y\n);\n    /* Correct: override at instantiation; no defparam anywhere\
    \ */\n// ..."
  narration: 'Avoid defparam — use #() instead. Review the code on screen and match
    it to files in the repository.'
