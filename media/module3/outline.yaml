- type: bullets
  title: 'Detail: What 1364-2005 Is'
  bullets:
  - 'Final Verilog-only standard: No SystemVerilog (no `logic`, interfaces, packages,
    classes).'
  - 'Clarifications: Refined wording and examples for 2001 features (e.g. generate,
    signed, scheduling).'
  - 'Minor additions: Additional system tasks and small syntax clarifications.'
  - 'Stable baseline: Many synthesis and style guides treat 1364-2005 as the Verilog
    baseline.'
  notes: From MODULE3 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: What 1364-2005 Is. Final Verilog-only standard:
    No SystemVerilog (no logic, interfaces, packages, classes). Clarifications: Refined
    wording and examples for 2001 features (e.g. generate, signed, scheduling). Minor
    additions: Additional system tasks and small syntax clarifications. Stable baseline:
    Many synthesis and style guides treat 1364-2005 as the Verilog...'
- type: bullets
  title: 'Detail: What 1364-2005 Adds or Clarifies Over 2001 (1)'
  bullets:
  - 'Clarifications: Scheduling, blocking vs nonblocking semantics, and generate behavior.'
  - 'System tasks: Additional or clarified tasks (e.g. `$realtime`, file I/O behavior).'
  - 'Deprecations: e.g. defparam is deprecated (use instantiation parameter override
    instead).'
  - 'Attributes: Clarified syntax and usage for tool-specific attributes.'
  notes: From MODULE3 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: What 1364-2005 Adds or Clarifies Over 2001
    (1). Clarifications: Scheduling, blocking vs nonblocking semantics, and generate
    behavior. System tasks: Additional or clarified tasks (e.g. $realtime, file I/O
    behavior). Deprecations: e.g. defparam is deprecated (use instantiation parameter
    override instead). Attributes: Clarified syntax and usage for tool-specific...'
- type: bullets
  title: 'Detail: What 1364-2005 Adds or Clarifies Over 2001 (2)'
  bullets:
  - 'No major new language features: The big step to new features is 1800 (Module
    4).'
  notes: From MODULE3 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: What 1364-2005 Adds or Clarifies Over 2001
    (2). No major new language features: The big step to new features is 1800 (Module
    4). From MODULE3 Topics Covered — protocol/design depth.'
- type: bullets
  title: 'Detail: What 1364-2005 Still Does Not Include'
  bullets:
  - 'No SystemVerilog: no `logic`, `always_comb`/`always_ff`, interfaces, packages,
    classes, assertions (SVA).'
  - No interfaces or type parameters (those are 1800).
  notes: From MODULE3 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: What 1364-2005 Still Does Not Include. No
    SystemVerilog: no logic, always_comb/always_ff, interfaces, packages, classes,
    assertions (SVA). No interfaces or type parameters (those are 1800). From MODULE3
    Topics Covered — protocol/design depth.'
- type: bullets
  title: 'Detail: Why defparam Is Deprecated'
  bullets:
  - 'Problem: Overrides a parameter deep in hierarchy from outside; hard to trace
    and tool-dependent.'
  - 'Preferred: Override at instantiation: `sub #(.WIDTH(16)) u_sub (...);`'
  notes: From MODULE3 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: Why defparam Is Deprecated. Problem: Overrides
    a parameter deep in hierarchy from outside; hard to trace and tool-dependent.
    Preferred: Override at instantiation: sub #(.WIDTH(16)) u_sub (...); From MODULE3
    Topics Covered — protocol/design depth.'
- type: bullets
  title: 'Detail: Correct Practice: Parameter Override at Instantiation'
  bullets:
  - 'Recommendation: Do not use defparam in new RTL; use named parameter override
