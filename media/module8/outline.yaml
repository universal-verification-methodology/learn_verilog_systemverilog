- type: code
  title: One-page course map
  language: systemverilog
  source_file: module8/examples/course_map/course_map.sv
  code: "/*\n * Module 8: Course map - module number, title, content summary\n * Reference\
    \ only; see module8/docs/course_map.md for links.\n */\n\nmodule top;\n    initial\
    \ begin\n        $display(\"=== Module 8: Course map (Modules 1-8) ===\");\n \
    \       $display(\"  1 | IEEE 1364-1995    | Verilog-95: wire/reg, assign, always/initial,\
    \ explicit sensitivity\");\n        $display(\"  2 | IEEE 1364-2001    | ANSI\
    \ ports, always @*, generate, signed, arrays, localparam\");\n        $display(\"\
    \  3 | IEEE 1364-2005    | Clarifications, synthesizable subset, defparam deprecated\"\
    );\n        $display(\"  4 | IEEE 1800-2005    | logic, always_comb/always_ff,\
    \ interfaces, packages, unique/priority case\");\n        $display(\"  5 | IEEE\
    \ 1800-2009/12 | Interface refinements, checkers, array/string methods, assertions\"\
    );\n        $display(\"  6 | IEEE 1800-2017    | Unified LRM, Verilog as subset\
    \ of 1800, current standard\");\n        $display(\"  7 | Version comparison|\
    \ Side-by-side, migration patterns, tool support, checklists\");\n        $display(\"\
    \  8 | Quick reference   | This module: tables, cheat sheet, course map\");\n\
    \        $display(\"  Learning path: 1->2->3->4->5->6 (version order); then 7;\
    \ use 8 as reference\");\n        $display(\"  Links: module8/docs/course_map.md\"\
    );\n// ..."
  narration: One-page course map. Review the code on screen and match it to files
    in the repository.
