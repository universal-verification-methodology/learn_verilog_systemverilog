- type: code
  title: Version timeline printer
  language: systemverilog
  source_file: module8/examples/version_timeline/version_timeline.sv
  code: "/*\n * Module 8: Version timeline - prints standard, year, role, module\n\
    \ * Reference only; see docs/MODULE8.md and module8/docs/\n */\n\nmodule top;\n\
    \    initial begin\n        $display(\"=== Module 8: Version timeline ===\");\n\
    \        $display(\"  1364-1995 | 1995 | First Verilog; base language        \
    \   | Module 1\");\n        $display(\"  1364-2001 | 2001 | ANSI, @*, generate,\
    \ signed             | Module 2\");\n        $display(\"  1364-2005 | 2005 | Last\
    \ Verilog-only; defparam deprecated  | Module 3\");\n        $display(\"  1800-2005\
    \ | 2005 | First SystemVerilog; logic, always_comb/ff | Module 4\");\n       \
    \ $display(\"  1800-2009 | 2009 | Interface refinements; clarifications   | Module\
    \ 5\");\n        $display(\"  1800-2012 | 2012 | Checker; array/string methods\
    \           | Module 5\");\n        $display(\"  1800-2017 | 2017 | Unified LRM;\
    \ current standard           | Module 6\");\n        $display(\"  Comparison and\
    \ migration                                   | Module 7\");\n        $display(\"\
    \  Quick reference and summary                                | Module 8\");\n\
    \        $display(\"  Path: 1->2->3->4->5->6 (version order); 7 (comparison);\
    \ 8 (reference)\");\n// ..."
  narration: Version timeline printer. Review the code on screen and match it to files
    in the repository.
