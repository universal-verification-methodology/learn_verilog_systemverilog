- type: section
  title: How to learn this module
- type: bullets
  title: Suggested learning path (1/2)
  bullets:
  - Skim this document — Goal, Overview, and Topics Covered set the IEEE scope for
    Module 8.
  - Study design architecture — See how DUTs, examples, and testbenches fit together
    under `module8/`.
  - Work through labs in order — Open `module8/EXAMPLES.md` and run each `make clean
    && make run` from the repo root.
  - Run the full module script — `./scripts/module8.sh` from the repo root to simulate
    all examples and tests.
  - Complete the exercises — Try each exercise in this document before reading solutions
    or peeking at reference RTL.
  notes: From docs/MODULE8.md — read guides before running demos.
- type: bullets
  title: Suggested learning path (2/2)
  bullets:
  - Use as reference — Module 8 summarizes the full course; run examples to print
    quick-reference slices, not to learn new RTL.
  - Review Common Pitfalls — Can you explain each mistake and the fix?
  - Self-check — Use `module8/CHECKLIST.md` before starting the next module.
  notes: From docs/MODULE8.md — read guides before running demos.
